name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build MCP Apps cards
        run: pnpm cards
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (policy, receipts, settlement, UCP, Ring, verifier, agents, MCP end-to-end)
        run: pnpm test
      - name: Red-team + proof-of-handoff evals (offline)
        run: |
          EVAL_N=300 EVAL_BENIGN=200 pnpm eval:redteam
          pnpm eval:poh
      - name: OSS contribution tests (ring-api-helloworld media helpers)
        working-directory: oss/ring-api-helloworld/scripts
        run: python3 -m unittest test_media_helpers -v
