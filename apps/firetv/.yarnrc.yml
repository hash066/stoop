# node-modules linker (not PnP) so Metro and tsc resolve the usual way.
# Hoist to the firetv root so packages/shared-ui (a source-only workspace that lists
# its RN deps as peers) can resolve react-native et al. from its realpath during tsc.
# Metro already lists ../../node_modules in nodeModulesPaths, so full hoisting is safe.
nodeLinker: node-modules
